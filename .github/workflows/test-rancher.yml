name: Rancher Server Manager Integration Tests

on:
  workflow_dispatch:
    inputs:
      rancher_host:
        description: 'Rancher host URL'
        required: true
      rancher_api_key:
        description: 'Rancher API key'
        required: true
      rancher_api_secret:
        description: 'Rancher API secret'
        required: true

# Rancher requires a live Kubernetes cluster, so this workflow is manual-trigger only.
# The fake driver runs automatically as part of ApplicationsIntegration in laravel.yml.
#
# To run fake-only application lifecycle tests on every push, see laravel.yml.
# To run against a real cluster, trigger this workflow with your Rancher credentials.

jobs:
  rancher-tests:

    runs-on: ubuntu-latest

    steps:
    - uses: shivammathur/setup-php@15c43e89cdef867065b0213be354c2841860869e
      with:
        php-version: '8.0'
    - uses: actions/checkout@v4
    - name: Copy .env
      run: php -r "file_exists('.env') || copy('.env.example', '.env');"
    - name: Install Dependencies
      run: composer install -q --no-ansi --no-interaction --no-scripts --no-progress --prefer-dist
    - name: Generate key
      run: php artisan key:generate
    - name: Directory Permissions
      run: chmod -R 777 storage bootstrap/cache
    - name: Create Database
      run: |
        mkdir -p database
        touch database/database.sqlite
    - name: Execute server manager tests against real Rancher
      env:
        DB_CONNECTION: sqlite
        DB_DATABASE: database/database.sqlite
        SERVER_MANAGER: rancher
        RANCHER_HOST: ${{ github.event.inputs.rancher_host }}
        RANCHER_API_KEY: ${{ github.event.inputs.rancher_api_key }}
        RANCHER_API_SECRET: ${{ github.event.inputs.rancher_api_secret }}
      run: php artisan test --testsuite=ApplicationsIntegration
