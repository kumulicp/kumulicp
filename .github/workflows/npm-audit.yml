name: NPM Security Audit

# Not run on PRs: advisories land independently of any change, and fixing them
# often needs dependency work unrelated to the PR. Run daily against main instead.
on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  npm-audit:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
    - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4.4.0
      with:
        node-version: '24'
        cache: 'npm'
    - name: Install Node Dependencies
      run: npm ci
    # Production dependencies only: dev tooling (e.g. the eslint config's
    # fast-glob -> braces chain, GHSA-vfj7-8cjw-p6xm, no patched release yet)
    # never ships and must not block merges.
    - name: NPM Security Audit
      run: npm audit --omit=dev --audit-level=high
