name: NPM Security Audit

# Not run on PRs: advisories land independently of any change, and fixing them
# often needs dependency work unrelated to the PR. Run daily against main instead.
on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  npm-audit:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
      with:
        node-version: '24'
        cache: 'npm'
    - name: Install Node Dependencies
      run: npm ci
    # Production dependencies only: dev tooling (e.g. the eslint config's
    # fast-glob -> braces chain, GHSA-vfj7-8cjw-p6xm, no patched release yet)
    # never ships and must not block merges.
    - name: NPM Security Audit
      run: npm audit --omit=dev --audit-level=high
