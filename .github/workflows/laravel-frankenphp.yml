name: Laravel (FrankenPHP)

# Runs the same Pest suites as the "Laravel" workflow (laravel.yml), but with
# Laravel Octane's FrankenPHP server installed and booted, instead of the
# default PHP-FPM-style CLI test runner. laravel.yml is left untouched and
# keeps testing the plain PHP-FPM path.
#
# Note: the Feature/AccountManagerLdap Pest suites call Laravel's in-process
# test client (TestCase::get()/post()/...), which never actually routes
# through whichever server (FPM or FrankenPHP) is configured - that part of
# the test run is identical either way. What this workflow adds on top is
# proving the app boots cleanly under Octane + our config/octane.php and the
# scoped() service bindings added for FrankenPHP worker-mode safety.
#
# On top of that, the "Boot a live FrankenPHP worker" step below actually
# starts php artisan octane:start and curls it, catching things the in-process
# Pest client never can - e.g. two real bugs found this way that only surface
# once a request actually round-trips through FrankenPHP's own bundled PHP
# build (currently 8.5, independent of the 8.4 this workflow otherwise runs):
#   - config/database.php referencing the PDO::MYSQL_ATTR_SSL_CA constant,
#     deprecated in PHP 8.5. The resulting deprecation notice printed to
#     stdout before the worker's first frankenphp_handle_request() call,
#     which corrupted FrankenPHP's handshake ("worker has not reached
#     frankenphp_handle_request()") - the exact failure this workflow used to
#     avoid by never booting a live worker.
#   - barryvdh/laravel-debugbar's storage.open config defaults to IP
#     autodetection (Symfony IpUtils::isPrivateIp()), which throws when
#     FrankenPHP's synthetic worker warm-up request has no REMOTE_ADDR.
#     Fixed by setting DEBUGBAR_OPEN_STORAGE=true in .env.sample.
#
# --workers is pinned to a small fixed number rather than "auto": booting
# with one worker thread per CPU core caused a one-off "zend_mm_heap
# corrupted" crash on a 16-core dev machine during local testing.

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  laravel-tests-frankenphp:
    runs-on: ubuntu-latest
    env:
      TELESCOPE_ENABLED: false
      OCTANE_SERVER: frankenphp
    steps:
    - uses: shivammathur/setup-php@15c43e89cdef867065b0213be354c2841860869e
      with:
        php-version: '8.4'
        ini-values: memory_limit=512M
    - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
    - name: Start LDAP
      run: |
        docker run -d --name ldap \
          -p 389:389 \
          -e LDAP_ORGANISATION="Demo" \
          -e LDAP_DOMAIN="example.com" \
          -e LDAP_ADMIN_PASSWORD="admin" \
          -v "${GITHUB_WORKSPACE}/.github/ldap/memberof.ldif:/container/service/slapd/assets/config/bootstrap/ldif/custom/memberof.ldif" \
          osixia/openldap:1.5.0 --copy-service
        until docker exec ldap ldapsearch -x -H ldap://localhost -b dc=example,dc=com -D 'cn=admin,dc=example,dc=com' -w admin > /dev/null 2>&1; do
          sleep 2
        done
    - name: Copy .env
      run: php -r "file_exists('.env') || copy('.env.sample', '.env');"
    - name: Install Dependencies
      run: composer install -q --no-ansi --no-interaction --no-scripts --no-progress --prefer-dist
    - name: Install Node Dependencies
      run: npm ci
    - name: Build Assets
      run: npm run build
    - name: Directory Permissions
      run: |
        mkdir -p storage/framework/views storage/framework/sessions storage/framework/cache storage/app/purifier storage/logs
        chmod -R 777 storage bootstrap/cache
    - name: Generate key
      run: php -r "file_put_contents('.env', preg_replace('/^APP_KEY=.*/m', 'APP_KEY=base64:'.base64_encode(random_bytes(32)), file_get_contents('.env')));"
    - name: Create Database
      run: |
        mkdir -p database
        touch database/database.sqlite
    - name: Run Migrations
      # Needed before the live-worker smoke test below, which hits the app
      # over real HTTP outside of any test's RefreshDatabase trait. The
      # Feature/AccountManagerLdap suites don't need this step themselves -
      # Pest's RefreshDatabase handles schema per-test - but a service
      # provider (ActionServiceProvider -> SettingsService) queries the DB
      # on every request regardless of route, so an unmigrated sqlite file
      # 500s even on a route that doesn't otherwise touch the database.
      env:
        DB_CONNECTION: sqlite
        DB_DATABASE: database/database.sqlite
      run: php artisan migrate --force
    - name: Install FrankenPHP
      # No --force: that also forces `vendor:publish --tag=octane-config`,
      # which would overwrite the repo's config/octane.php (the
      # FlushApplicationFacadeState listener and the scoped-binding "flush"
      # entries) with laravel/octane's stub. octane:install is otherwise
      # idempotent and skips the binary download if it's already present.
      run: php artisan octane:install --server=frankenphp --no-interaction
    - name: Boot a live FrankenPHP worker and smoke test it
      env:
        DB_CONNECTION: sqlite
        DB_DATABASE: database/database.sqlite
      run: |
        php artisan octane:start --server=frankenphp --host=127.0.0.1 --port=8000 --admin-port=2019 --workers=2 > octane.log 2>&1 &
        echo $! > octane.pid

        ready=0
        for i in $(seq 1 30); do
          if curl -sf -o /dev/null http://127.0.0.1:8000/up; then
            ready=1
            break
          fi
          sleep 1
        done
        if [ "$ready" -ne 1 ]; then
          echo "FrankenPHP worker never became healthy"
          cat octane.log
          tail -n 100 storage/logs/laravel.log 2>/dev/null
          exit 1
        fi

        status=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8000/)
        if [ "$status" != "200" ] && [ "$status" != "302" ]; then
          echo "Unexpected status code from / : $status"
          cat octane.log
          tail -n 100 storage/logs/laravel.log 2>/dev/null
          exit 1
        fi

        kill "$(cat octane.pid)"
        cat octane.log
    - name: Execute Feature tests
      env:
        DB_CONNECTION: sqlite
        DB_DATABASE: database/database.sqlite
      run: php artisan test --testsuite=Feature
    - name: Execute AccountManagerLdap tests
      env:
        DB_CONNECTION: sqlite
        DB_DATABASE: database/database.sqlite
        ACCOUNTMANAGER_DRIVER: ldap
        PROVIDER: ldap
        LDAP_HOST: localhost
        LDAP_PORT: 389
        LDAP_USERNAME: "cn=admin,dc=example,dc=com"
        LDAP_PASSWORD: admin
        LDAP_BASE_DN: "dc=example,dc=com"
        LDAP_TLS: false
      run: php artisan test --testsuite=AccountManagerLdap
