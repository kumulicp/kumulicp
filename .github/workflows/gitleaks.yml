name: Gitleaks

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
      with:
        fetch-depth: 0
    - name: Install gitleaks
      env:
        GITLEAKS_VERSION: 8.30.1
        GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
      run: |
        curl -sSfL -o gitleaks.tar.gz \
          "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
        echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum -c -
        tar -xzf gitleaks.tar.gz gitleaks
    # Scan only the commits introduced by this push/PR. Older history still
    # holds findings that are being rotated, which would fail every run.
    - name: Scan new commits
      env:
        EVENT_NAME: ${{ github.event_name }}
        PR_BASE: ${{ github.event.pull_request.base.sha }}
        PR_HEAD: ${{ github.event.pull_request.head.sha }}
        PUSH_BEFORE: ${{ github.event.before }}
        PUSH_AFTER: ${{ github.sha }}
      run: |
        if [ "$EVENT_NAME" = "pull_request" ]; then
          range="${PR_BASE}..${PR_HEAD}"
        elif [ "$PUSH_BEFORE" = "0000000000000000000000000000000000000000" ]; then
          range="-1 ${PUSH_AFTER}"
        else
          range="${PUSH_BEFORE}..${PUSH_AFTER}"
        fi
        ./gitleaks git --redact --verbose --log-opts="${range}" .
