name: Namecheap Registrar Integration Tests

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  namecheap-tests:

    runs-on: ubuntu-latest

    steps:
    - uses: shivammathur/setup-php@15c43e89cdef867065b0213be354c2841860869e
      with:
        php-version: '8.0'
    - uses: actions/checkout@v4
    - name: Copy .env
      run: php -r "file_exists('.env') || copy('.env.example', '.env');"
    - name: Install Dependencies
      run: composer install -q --no-ansi --no-interaction --no-scripts --no-progress --prefer-dist
    - name: Generate key
      run: php artisan key:generate
    - name: Directory Permissions
      run: chmod -R 777 storage bootstrap/cache
    - name: Create Database
      run: |
        mkdir -p database
        touch database/database.sqlite
    - name: Execute Registrar tests (fake always, Namecheap when secrets present)
      env:
        DB_CONNECTION: sqlite
        DB_DATABASE: database/database.sqlite
        REGISTRAR_DRIVER: ${{ secrets.NAMECHEAP_API_KEY && 'namecheap' || 'fake' }}
        NAMECHEAP_API_USER: ${{ secrets.NAMECHEAP_API_USER }}
        NAMECHEAP_API_KEY: ${{ secrets.NAMECHEAP_API_KEY }}
        NAMECHEAP_USERNAME: ${{ secrets.NAMECHEAP_USERNAME }}
        NAMECHEAP_CLIENT_IP: ${{ secrets.NAMECHEAP_CLIENT_IP }}
        NAMECHEAP_SANDBOX: "true"
      run: php artisan test --testsuite=RegistrarIntegration
