name: Laravel

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  laravel-tests:
    runs-on: ubuntu-latest
    env:
      TELESCOPE_ENABLED: false
    services:
      ldap:
        image: osixia/openldap:1.5.0
        ports:
          - 389:389
        env:
          LDAP_ORGANISATION: Demo
          LDAP_DOMAIN: example.com
          LDAP_ADMIN_PASSWORD: admin
        options: >-
          --health-cmd "ldapsearch -x -H ldap://localhost -b dc=example,dc=com -D 'cn=admin,dc=example,dc=com' -w admin"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
    - uses: shivammathur/setup-php@15c43e89cdef867065b0213be354c2841860869e
      with:
        php-version: '8.4'
        ini-values: memory_limit=512M
    - uses: actions/checkout@v4
    - name: Copy .env
      run: php -r "file_exists('.env') || copy('.env.sample', '.env');"
    - name: Install Dependencies
      run: composer install -q --no-ansi --no-interaction --no-scripts --no-progress --prefer-dist
    - name: Install Node Dependencies
      run: npm ci
    - name: Build Assets
      run: npm run build
    - name: Generate key
      run: php artisan key:generate
    - name: Directory Permissions
      run: |
        mkdir -p storage/framework/views storage/framework/sessions storage/framework/cache storage/app/purifier
        chmod -R 777 storage bootstrap/cache
    - name: Create Database
      run: |
        mkdir -p database
        touch database/database.sqlite
    - name: Configure LDAP memberOf overlay
      run: |
        LDAP_CONTAINER=$(docker ps --filter "ancestor=osixia/openldap:1.5.0" --format "{{.ID}}")
        cat > /tmp/memberof-module.ldif <<'LDIF'
        dn: cn=module{0},cn=config
        changetype: modify
        add: olcModuleLoad
        olcModuleLoad: memberof
        LDIF
        cat > /tmp/memberof-overlay.ldif <<'LDIF'
        dn: olcOverlay=memberof,olcDatabase={1}mdb,cn=config
        changetype: add
        objectClass: olcOverlayConfig
        objectClass: olcMemberOf
        olcOverlay: memberof
        olcMemberOfGroupOC: groupOfNames
        olcMemberOfMemberAD: member
        olcMemberOfMemberOfAD: memberOf
        LDIF
        docker cp /tmp/memberof-module.ldif "$LDAP_CONTAINER":/tmp/memberof-module.ldif
        docker cp /tmp/memberof-overlay.ldif "$LDAP_CONTAINER":/tmp/memberof-overlay.ldif
        docker exec "$LDAP_CONTAINER" ldapmodify -Y EXTERNAL -H ldapi:/// -f /tmp/memberof-module.ldif
        docker exec "$LDAP_CONTAINER" ldapadd -Y EXTERNAL -H ldapi:/// -f /tmp/memberof-overlay.ldif
    - name: Execute Feature tests
      env:
        DB_CONNECTION: sqlite
        DB_DATABASE: database/database.sqlite
      run: php artisan test --testsuite=Feature
    - name: Execute AccountManagerLdap tests
      env:
        DB_CONNECTION: sqlite
        DB_DATABASE: database/database.sqlite
        ACCOUNTMANAGER_DRIVER: ldap
        PROVIDER: ldap
        LDAP_HOST: localhost
        LDAP_PORT: 389
        LDAP_USERNAME: "cn=admin,dc=example,dc=com"
        LDAP_PASSWORD: admin
        LDAP_BASE_DN: "dc=example,dc=com"
      run: php artisan test --testsuite=AccountManagerLdap
