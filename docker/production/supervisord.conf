[supervisord]
nodaemon=true
; Runs as www-data (not root), so everything it writes goes to /tmp.
logfile=/tmp/supervisord.log
pidfile=/tmp/supervisord.pid
childlogdir=/tmp
logfile_maxbytes=10MB
logfile_backups=1
loglevel=error

[program:laravel-worker]
process_name=%(program_name)s_%(process_num)02d
command=php /var/www/html/artisan queue:work --sleep=3 --tries=3 --max-time=3600
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
numprocs=%(ENV_QUEUE_WORKERS)s
redirect_stderr=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stopwaitsecs=3600

; Handles $long_running actions (see App\Actions\Action::$long_running) --
; helm operations with --wait can take several minutes, so this connection
; has a longer retry_after (config/queue.php) and needs --timeout above
; that so the worker doesn't kill the job first. Only dispatched to when
; QUEUE_LONG_CONNECTION is set (see .env.sample) -- omit this program if
; that's unset for this deployment.
[program:laravel-worker-long]
process_name=%(program_name)s_%(process_num)02d
command=php /var/www/html/artisan queue:work database-long --queue=long --sleep=3 --tries=1 --timeout=900 --max-time=3600
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
numprocs=%(ENV_QUEUE_LONG_WORKERS)s
redirect_stderr=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stopwaitsecs=900

[program:apache2]
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
command=apache2-foreground

; Replaces crond: runs the Laravel scheduler once a minute, without root.
[program:scheduler]
directory=/var/www/html
command=php artisan schedule:work
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
